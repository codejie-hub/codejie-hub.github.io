<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">条件速度标签与边际速度不是一回事</title><desc id="desc">相同 t、相同 X_t，可以对应不同端点配对。根据文章整理的教学示意。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="52" font-size="30" fill="#253247" text-anchor="start" font-weight="700">条件速度标签与边际速度不是一回事</text>
<text x="40" y="88" font-size="19" fill="#637084" text-anchor="start" font-weight="400">相同 t、相同 X_t，可以对应不同端点配对</text>
<rect x="65" y="150" width="260" height="100" rx="12" fill="#f8fafc" stroke="#4264ad" stroke-width="2"/>
<text x="195.0" y="192.0" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">配对路径 A</text>
<text x="195.0" y="226.0" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">速度标签 U₁</text>
<rect x="65" y="355" width="260" height="100" rx="12" fill="#f8fafc" stroke="#b15e7b" stroke-width="2"/>
<text x="195.0" y="397.0" font-size="24" fill="#b15e7b" text-anchor="middle" font-weight="400">配对路径 B</text>
<text x="195.0" y="431.0" font-size="24" fill="#b15e7b" text-anchor="middle" font-weight="400">速度标签 U₂</text>
<circle cx="485" cy="300" r="38" fill="#fff" stroke="#198477" stroke-width="3"/>
<text x="485" y="309" font-size="30" fill="#198477" text-anchor="middle" font-weight="400">x</text>
<path d="M325,200 L450,280" fill="none" stroke="#4264ad" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M325,405 L450,325" fill="none" stroke="#b15e7b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="650" y="240" width="310" height="125" rx="12" fill="#f8fafc" stroke="#198477" stroke-width="2"/>
<text x="805.0" y="294.5" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">平方误差回归</text>
<text x="805.0" y="328.5" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">u_t(x) = E[U_t | X_t=x]</text>
<path d="M525,300 L640,300" fill="none" stroke="#4264ad" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="510" font-size="27" fill="#253247" text-anchor="middle" font-weight="400">模型学习条件平均速度；生成时再沿该速度场积分</text>
<path d="M40,544 L960,544" fill="none" stroke="#e2e7ef" stroke-width="1"/>
<text x="40" y="576" font-size="18" fill="#69778a" text-anchor="start" font-weight="400">示意节点表示同一时间切片；不将单条训练插值当成生成轨迹。</text>
</svg>
