<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">把相机里的目标放到机器人基座系</title><desc id="desc">T 的上标表示目标系，下标表示源系；图以末端安装相机为例。根据文章整理的教学示意。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="52" font-size="30" fill="#253247" text-anchor="start" font-weight="700">把相机里的目标放到机器人基座系</text>
<text x="40" y="88" font-size="19" fill="#637084" text-anchor="start" font-weight="400">T 的上标表示目标系，下标表示源系；图以末端安装相机为例</text>
<rect x="40.0" y="185" width="283.3333333333333" height="105" rx="12" fill="#f8fafc" stroke="#4264ad" stroke-width="2"/>
<text x="181.66666666666666" y="229.5" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">目标坐标</text>
<text x="181.66666666666666" y="263.5" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">相机系 C</text>
<rect x="358.3333333333333" y="185" width="283.3333333333333" height="105" rx="12" fill="#f8fafc" stroke="#198477" stroke-width="2"/>
<text x="500.0" y="229.5" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">手眼关系</text>
<text x="500.0" y="263.5" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">末端系 E</text>
<path d="M328.3333333333333,237 L350.3333333333333,237" fill="none" stroke="#4264ad" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="676.6666666666666" y="185" width="283.3333333333333" height="105" rx="12" fill="#f8fafc" stroke="#b57836" stroke-width="2"/>
<text x="818.3333333333333" y="229.5" font-size="24" fill="#b57836" text-anchor="middle" font-weight="400">当前末端位姿</text>
<text x="818.3333333333333" y="263.5" font-size="24" fill="#b57836" text-anchor="middle" font-weight="400">基座系 B</text>
<path d="M646.6666666666666,237 L668.6666666666666,237" fill="none" stroke="#4264ad" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="405" font-size="32" fill="#253247" text-anchor="middle" font-weight="400">ᴮT_target = ᴮT_E · ᴱT_C · ᶜT_target</text>
<text x="500" y="475" font-size="25" fill="#253247" text-anchor="middle" font-weight="400">从右向左作用；每一步的相邻坐标系必须匹配</text>
<path d="M40,544 L960,544" fill="none" stroke="#e2e7ef" stroke-width="1"/>
<text x="40" y="576" font-size="18" fill="#69778a" text-anchor="start" font-weight="400">外置相机的变换链不同；正文统一的是坐标系约定，而非固定安装方式。</text>
</svg>
