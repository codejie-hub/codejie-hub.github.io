<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">从像素误差到机器人执行量</title><desc id="desc">速度表达坐标系与速度参考点必须同时说明。根据文章整理的教学示意。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="52" font-size="30" fill="#253247" text-anchor="start" font-weight="700">从像素误差到机器人执行量</text>
<text x="40" y="88" font-size="19" fill="#637084" text-anchor="start" font-weight="400">速度表达坐标系与速度参考点必须同时说明</text>
<rect x="40.0" y="185" width="283.3333333333333" height="105" rx="12" fill="#f8fafc" stroke="#4264ad" stroke-width="2"/>
<text x="181.66666666666666" y="229.5" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">图像误差 e</text>
<text x="181.66666666666666" y="263.5" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">交互矩阵 L</text>
<rect x="358.3333333333333" y="185" width="283.3333333333333" height="105" rx="12" fill="#f8fafc" stroke="#198477" stroke-width="2"/>
<text x="500.0" y="229.5" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">相机速度 Vc</text>
<text x="500.0" y="263.5" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">阻尼伪逆等控制律</text>
<path d="M328.3333333333333,237 L350.3333333333333,237" fill="none" stroke="#4264ad" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="676.6666666666666" y="185" width="283.3333333333333" height="105" rx="12" fill="#f8fafc" stroke="#b57836" stroke-width="2"/>
<text x="818.3333333333333" y="229.5" font-size="24" fill="#b57836" text-anchor="middle" font-weight="400">机器人执行量</text>
<text x="818.3333333333333" y="263.5" font-size="24" fill="#b57836" text-anchor="middle" font-weight="400">速度换系 + 运动学</text>
<path d="M646.6666666666666,237 L668.6666666666666,237" fill="none" stroke="#4264ad" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="230" y="390" width="540" height="100" rx="12" fill="#f8fafc" stroke="#198477" stroke-width="2"/>
<text x="500.0" y="432.0" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">相机 / 末端 / 基座：变换链一致</text>
<text x="500.0" y="466.0" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">同一参考点换基 vs 改变速度参考点</text>
<path d="M40,544 L960,544" fill="none" stroke="#e2e7ef" stroke-width="1"/>
<text x="40" y="576" font-size="18" fill="#69778a" text-anchor="start" font-weight="400">改变速度参考点时通常包含角速度 × 杠杆臂项；仅换基与换参考点不同。</text>
</svg>
