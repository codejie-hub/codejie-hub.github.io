<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">MC 与 TD(0)：等到什么时候更新？</title><desc id="desc">两条路径使用相同经历，但回归目标不同。根据文章整理的教学示意。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="52" font-size="30" fill="#253247" text-anchor="start" font-weight="700">MC 与 TD(0)：等到什么时候更新？</text>
<text x="40" y="88" font-size="19" fill="#637084" text-anchor="start" font-weight="400">两条路径使用相同经历，但回归目标不同</text>
<text x="45" y="210" font-size="27" fill="#4264ad" text-anchor="start" font-weight="700">MC</text>
<rect x="220" y="175" width="130" height="70" rx="12" fill="#f8fafc" stroke="#4264ad" stroke-width="2"/>
<text x="285.0" y="218.0" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">sₜ</text>
<rect x="420" y="175" width="130" height="70" rx="12" fill="#f8fafc" stroke="#4264ad" stroke-width="2"/>
<text x="485.0" y="218.0" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">sₜ₊₁</text>
<path d="M360,210 L412,210" fill="none" stroke="#4264ad" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="620" y="175" width="130" height="70" rx="12" fill="#f8fafc" stroke="#4264ad" stroke-width="2"/>
<text x="685.0" y="218.0" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">…</text>
<path d="M560,210 L612,210" fill="none" stroke="#4264ad" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="820" y="175" width="130" height="70" rx="12" fill="#f8fafc" stroke="#4264ad" stroke-width="2"/>
<text x="885.0" y="218.0" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">终止</text>
<path d="M760,210 L812,210" fill="none" stroke="#4264ad" stroke-width="3" marker-end="url(#arrow)"/>
<text x="300" y="295" font-size="25" fill="#4264ad" text-anchor="start" font-weight="400">等待完整回报 Gₜ</text>
<text x="45" y="420" font-size="27" fill="#198477" text-anchor="start" font-weight="700">TD(0)</text>
<rect x="220" y="385" width="130" height="70" rx="12" fill="#f8fafc" stroke="#198477" stroke-width="2"/>
<text x="285.0" y="428.0" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">sₜ</text>
<rect x="420" y="385" width="130" height="70" rx="12" fill="#f8fafc" stroke="#198477" stroke-width="2"/>
<text x="485.0" y="428.0" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">sₜ₊₁</text>
<path d="M360,420 L412,420" fill="none" stroke="#198477" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="620" y="385" width="130" height="70" rx="12" fill="#f8fafc" stroke="#198477" stroke-width="2"/>
<text x="685.0" y="428.0" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">…</text>
<path d="M560,420 L612,420" fill="none" stroke="#198477" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="820" y="385" width="130" height="70" rx="12" fill="#f8fafc" stroke="#198477" stroke-width="2"/>
<text x="885.0" y="428.0" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">终止</text>
<path d="M760,420 L812,420" fill="none" stroke="#198477" stroke-width="3" marker-end="url(#arrow)"/>
<text x="300" y="505" font-size="25" fill="#198477" text-anchor="start" font-weight="400">一步后：rₜ + γV(sₜ₊₁)</text>
<path d="M40,544 L960,544" fill="none" stroke="#e2e7ef" stroke-width="1"/>
<text x="40" y="576" font-size="18" fill="#69778a" text-anchor="start" font-weight="400">终止状态的后续价值为零；截断与真实终止的处理需分别检查。</text>
</svg>
