<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">滚动规划：每次只兑现短前缀</title><desc id="desc">在模型中比较候选；在真实世界执行后，用新观测修正状态。。根据文章整理的教学示意。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="52" font-size="30" fill="#253247" text-anchor="start" font-weight="700">滚动规划：每次只兑现短前缀</text>
<text x="40" y="88" font-size="19" fill="#637084" text-anchor="start" font-weight="400">在模型中比较候选；在真实世界执行后，用新观测修正状态。</text>
<rect x="35" y="135" width="200" height="95" rx="12" fill="#f8fafc" stroke="#4264ad" stroke-width="2"/>
<text x="135.0" y="174.5" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">观测更新</text>
<text x="135.0" y="208.5" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">当前状态</text>
<rect x="270" y="135" width="200" height="95" rx="12" fill="#f8fafc" stroke="#8064a8" stroke-width="2"/>
<text x="370.0" y="174.5" font-size="24" fill="#8064a8" text-anchor="middle" font-weight="400">候选序列</text>
<text x="370.0" y="208.5" font-size="24" fill="#8064a8" text-anchor="middle" font-weight="400">模型评分</text>
<path d="M240,182 L262,182" fill="none" stroke="#4264ad" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="505" y="135" width="200" height="95" rx="12" fill="#f8fafc" stroke="#198477" stroke-width="2"/>
<text x="605.0" y="174.5" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">选择方案</text>
<text x="605.0" y="208.5" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">执行第一步</text>
<path d="M475,182 L497,182" fill="none" stroke="#4264ad" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="740" y="135" width="200" height="95" rx="12" fill="#f8fafc" stroke="#4264ad" stroke-width="2"/>
<text x="840.0" y="174.5" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">新观测</text>
<text x="840.0" y="208.5" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">重新规划</text>
<path d="M710,182 L732,182" fill="none" stroke="#4264ad" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M100,355 L870,355" fill="none" stroke="#8b97a7" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M100,355 L100,275" fill="none" stroke="#8b97a7" stroke-width="3" marker-end="url(#arrow)"/>
<text x="866" y="388" font-size="20" fill="#253247" text-anchor="end" font-weight="400">未来步骤</text>
<text x="103" y="263" font-size="20" fill="#253247" text-anchor="start" font-weight="400"></text>
<path d="M120.00,335.00 L260.00,300.00 L400.00,290.00 L540.00,270.00 L680.00,285.00 L820.00,265.00" fill="none" stroke="#8064a8" stroke-width="3" stroke-dasharray="8 6"/>
<path d="M120.00,335.00 L260.00,315.00 L400.00,265.00 L540.00,270.00 L680.00,250.00 L820.00,260.00" fill="none" stroke="#b15e7b" stroke-width="3" stroke-dasharray="8 6"/>
<path d="M120,335 L260,315" fill="none" stroke="#198477" stroke-width="6"/>
<circle cx="260" cy="315" r="7" fill="#198477" stroke="none" stroke-width="3"/>
<text x="420" y="335" font-size="20" fill="#198477" text-anchor="start" font-weight="400">真实执行至此后重新估计</text>
<path d="M40,424 L920,424" fill="none" stroke="#e2e7ef" stroke-width="1"/>
<text x="40" y="456" font-size="18" fill="#69778a" text-anchor="start" font-weight="400">虚线：尚未执行的候选未来  ·  绿线：短前缀执行  |  概念示意，非实验轨迹</text>
</svg>
