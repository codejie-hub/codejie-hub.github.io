<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">SwiGLU：两个分支，一次门控</title><desc id="desc">中间宽度 d_ff 与模型宽度 d_model 分开标记。根据文章整理的教学示意。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="52" font-size="30" fill="#253247" text-anchor="start" font-weight="700">SwiGLU：两个分支，一次门控</text>
<text x="40" y="88" font-size="19" fill="#637084" text-anchor="start" font-weight="400">中间宽度 d_ff 与模型宽度 d_model 分开标记</text>
<rect x="40" y="245" width="125" height="100" rx="12" fill="#f8fafc" stroke="#4264ad" stroke-width="2"/>
<text x="102.5" y="287.0" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">输入 x</text>
<text x="102.5" y="321.0" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">d_model</text>
<rect x="280" y="145" width="230" height="95" rx="12" fill="#f8fafc" stroke="#198477" stroke-width="2"/>
<text x="395.0" y="184.5" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">W_gate</text>
<text x="395.0" y="218.5" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">SiLU</text>
<rect x="280" y="365" width="230" height="95" rx="12" fill="#f8fafc" stroke="#4264ad" stroke-width="2"/>
<text x="395.0" y="404.5" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">W_up</text>
<text x="395.0" y="438.5" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">线性</text>
<circle cx="650" cy="295" r="35" fill="#fff" stroke="#b57836" stroke-width="3"/>
<text x="650" y="307" font-size="32" fill="#b57836" text-anchor="middle" font-weight="400">⊙</text>
<rect x="795" y="245" width="165" height="100" rx="12" fill="#f8fafc" stroke="#b15e7b" stroke-width="2"/>
<text x="877.5" y="287.0" font-size="24" fill="#b15e7b" text-anchor="middle" font-weight="400">W_down</text>
<text x="877.5" y="321.0" font-size="24" fill="#b15e7b" text-anchor="middle" font-weight="400">→ d_model</text>
<path d="M165,280 L275,190" fill="none" stroke="#4264ad" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M165,315 L275,410" fill="none" stroke="#4264ad" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M510,190 L625,270" fill="none" stroke="#4264ad" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M510,410 L625,325" fill="none" stroke="#4264ad" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M685,295 L790,295" fill="none" stroke="#4264ad" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="510" font-size="25" fill="#253247" text-anchor="middle" font-weight="400">FFN(x) = [SiLU(xW_gate) ⊙ (xW_up)] W_down</text>
<path d="M40,544 L960,544" fill="none" stroke="#e2e7ef" stroke-width="1"/>
<text x="40" y="576" font-size="18" fill="#69778a" text-anchor="start" font-weight="400">⊙ 表示逐元素乘法；图中省略偏置及具体框架的矩阵存储转置约定。</text>
</svg>
