<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">观测、预测、执行：三个窗口</title><desc id="desc">To：观测帧数；Tp：预测动作数；Ta：实际执行片段。根据文章整理的教学示意。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="52" font-size="30" fill="#253247" text-anchor="start" font-weight="700">观测、预测、执行：三个窗口</text>
<text x="40" y="88" font-size="19" fill="#637084" text-anchor="start" font-weight="400">To：观测帧数；Tp：预测动作数；Ta：实际执行片段</text>
<path d="M80,230 L925,230" fill="none" stroke="#8b97a7" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="145" width="80" height="60" rx="12" fill="#f8fafc" stroke="#4264ad" stroke-width="2"/>
<text x="110.0" y="183.0" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">o₋2</text>
<rect x="170" y="145" width="80" height="60" rx="12" fill="#f8fafc" stroke="#4264ad" stroke-width="2"/>
<text x="210.0" y="183.0" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">o₋1</text>
<rect x="270" y="145" width="80" height="60" rx="12" fill="#f8fafc" stroke="#4264ad" stroke-width="2"/>
<text x="310.0" y="183.0" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">o₀</text>
<rect x="385" y="280" width="75" height="65" rx="12" fill="#f8fafc" stroke="#198477" stroke-width="2"/>
<text x="422.5" y="320.5" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">a0</text>
<rect x="475" y="280" width="75" height="65" rx="12" fill="#f8fafc" stroke="#198477" stroke-width="2"/>
<text x="512.5" y="320.5" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">a1</text>
<rect x="565" y="280" width="75" height="65" rx="12" fill="#f8fafc" stroke="#4264ad" stroke-width="2"/>
<text x="602.5" y="320.5" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">a2</text>
<rect x="655" y="280" width="75" height="65" rx="12" fill="#f8fafc" stroke="#4264ad" stroke-width="2"/>
<text x="692.5" y="320.5" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">a3</text>
<rect x="745" y="280" width="75" height="65" rx="12" fill="#f8fafc" stroke="#4264ad" stroke-width="2"/>
<text x="782.5" y="320.5" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">a4</text>
<rect x="835" y="280" width="75" height="65" rx="12" fill="#f8fafc" stroke="#4264ad" stroke-width="2"/>
<text x="872.5" y="320.5" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">a5</text>
<text x="200" y="115" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">历史观测 To</text>
<text x="650" y="395" font-size="25" fill="#4264ad" text-anchor="middle" font-weight="400">预测动作窗口 Tp</text>
<path d="M385,365 L550,365" fill="none" stroke="#198477" stroke-width="7"/>
<text x="465" y="445" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">执行 Ta</text>
<path d="M550,465 L780,465" fill="none" stroke="#198477" stroke-width="3" marker-end="url(#arrow)"/>
<text x="785" y="475" font-size="22" fill="#198477" text-anchor="start" font-weight="400">新观测 → 重采样</text>
<path d="M40,544 L960,544" fill="none" stroke="#e2e7ef" stroke-width="1"/>
<text x="40" y="576" font-size="18" fill="#69778a" text-anchor="start" font-weight="400">窗口长度仅为说明相对关系的示例；动作时间单位由训练数据与控制接口决定。</text>
</svg>
