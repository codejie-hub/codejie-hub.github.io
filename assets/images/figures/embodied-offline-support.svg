<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">离线自举：没有样本约束的高 Q 值</title><desc id="desc">教学 MDP · 即时奖励 r = 0 · 折扣 γ = 0.9。根据文章整理的教学示意。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="52" font-size="30" fill="#253247" text-anchor="start" font-weight="700">离线自举：没有样本约束的高 Q 值</text>
<text x="40" y="88" font-size="19" fill="#637084" text-anchor="start" font-weight="400">教学 MDP · 即时奖励 r = 0 · 折扣 γ = 0.9</text>
<rect x="45" y="190" width="175" height="100" rx="12" fill="#f8fafc" stroke="#4264ad" stroke-width="2"/>
<text x="132.5" y="232.0" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">状态 s₀</text>
<text x="132.5" y="266.0" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">数据动作 a₀</text>
<rect x="330" y="190" width="150" height="100" rx="12" fill="#f8fafc" stroke="#4264ad" stroke-width="2"/>
<text x="405.0" y="232.0" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">状态 s₁</text>
<text x="405.0" y="266.0" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">需要后续价值</text>
<path d="M225,240 L320,240" fill="none" stroke="#4264ad" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="635" y="120" width="275" height="100" rx="12" fill="#f8fafc" stroke="#198477" stroke-width="2"/>
<text x="772.5" y="162.0" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">已见动作 A</text>
<text x="772.5" y="196.0" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">Q = 1</text>
<rect x="635" y="290" width="275" height="100" rx="12" fill="#f8fafc" stroke="#b15e7b" stroke-width="2"/>
<text x="772.5" y="332.0" font-size="24" fill="#b15e7b" text-anchor="middle" font-weight="400">未见动作 B</text>
<text x="772.5" y="366.0" font-size="24" fill="#b15e7b" text-anchor="middle" font-weight="400">网络猜测 Q = 10</text>
<path d="M485,225 L625,170" fill="none" stroke="#198477" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M485,260 L625,340" fill="none" stroke="#b15e7b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="220" y="365" font-size="25" fill="#b15e7b" text-anchor="middle" font-weight="700">max 自举目标 = 9</text>
<text x="220" y="400" font-size="21" fill="#198477" text-anchor="middle" font-weight="400">数据支持的后续值：0.9</text>
<path d="M40,424 L920,424" fill="none" stroke="#e2e7ef" stroke-width="1"/>
<text x="40" y="456" font-size="18" fill="#69778a" text-anchor="start" font-weight="400">“未见”并不表示真实回报为零；问题是训练数据无法校正这个虚高估计。</text>
</svg>
