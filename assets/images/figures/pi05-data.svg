<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
<title id="title">π0.5：六类数据，几种不同监督</title><desc id="desc">数据标签并非互斥物理小时数；HL 可能来自机器人数据再标注。根据文章整理的教学示意。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="52" font-size="30" fill="#253247" text-anchor="start" font-weight="700">π0.5：六类数据，几种不同监督</text>
<text x="40" y="88" font-size="19" fill="#637084" text-anchor="start" font-weight="400">数据标签并非互斥物理小时数；HL 可能来自机器人数据再标注</text>
<rect x="40" y="135" width="280" height="105" rx="12" fill="#f8fafc" stroke="#4264ad" stroke-width="2"/>
<text x="180.0" y="179.5" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">MM</text>
<text x="180.0" y="213.5" font-size="24" fill="#4264ad" text-anchor="middle" font-weight="400">移动机器人 / 家庭</text>
<rect x="360" y="135" width="280" height="105" rx="12" fill="#f8fafc" stroke="#198477" stroke-width="2"/>
<text x="500.0" y="179.5" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">ME</text>
<text x="500.0" y="213.5" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">固定机器人 / 家庭</text>
<rect x="680" y="135" width="280" height="105" rx="12" fill="#f8fafc" stroke="#b57836" stroke-width="2"/>
<text x="820.0" y="179.5" font-size="24" fill="#b57836" text-anchor="middle" font-weight="400">CE</text>
<text x="820.0" y="213.5" font-size="24" fill="#b57836" text-anchor="middle" font-weight="400">跨本体 / 实验室</text>
<rect x="40" y="280" width="280" height="105" rx="12" fill="#f8fafc" stroke="#b15e7b" stroke-width="2"/>
<text x="180.0" y="324.5" font-size="24" fill="#b15e7b" text-anchor="middle" font-weight="400">HL</text>
<text x="180.0" y="358.5" font-size="24" fill="#b15e7b" text-anchor="middle" font-weight="400">子任务与框标注</text>
<rect x="360" y="280" width="280" height="105" rx="12" fill="#f8fafc" stroke="#8063a9" stroke-width="2"/>
<text x="500.0" y="324.5" font-size="24" fill="#8063a9" text-anchor="middle" font-weight="400">WD</text>
<text x="500.0" y="358.5" font-size="24" fill="#8063a9" text-anchor="middle" font-weight="400">图文 / VQA / 定位</text>
<rect x="680" y="280" width="280" height="105" rx="12" fill="#f8fafc" stroke="#6d8845" stroke-width="2"/>
<text x="820.0" y="324.5" font-size="24" fill="#6d8845" text-anchor="middle" font-weight="400">VI</text>
<text x="820.0" y="358.5" font-size="24" fill="#6d8845" text-anchor="middle" font-weight="400">执行中高层指导</text>
<rect x="150" y="475" width="700" height="100" rx="12" fill="#f8fafc" stroke="#198477" stroke-width="2"/>
<text x="500.0" y="517.0" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">共享视觉语言表征 → 对应任务的监督目标</text>
<text x="500.0" y="551.0" font-size="24" fill="#198477" text-anchor="middle" font-weight="400">离散序列交叉熵 / 连续动作 Flow Matching</text>
<path d="M40,624 L960,624" fill="none" stroke="#e2e7ef" stroke-width="1"/>
<text x="40" y="656" font-size="18" fill="#69778a" text-anchor="start" font-weight="400">预训练与后训练选择不同数据组合；互联网图文样本不凭空拥有机器人动作标签。</text>
</svg>
