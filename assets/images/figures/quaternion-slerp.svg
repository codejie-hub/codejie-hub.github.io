<svg xmlns="http://www.w3.org/2000/svg" width="780" height="600" viewBox="0 0 780 600" role="img" aria-labelledby="title desc">
<title id="title">SLERP：单位四元数与较短球面弧</title><desc id="desc">低维球面截面，不把四元数当成三维位置。根据文章整理的教学示意。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="52" font-size="30" fill="#253247" text-anchor="start" font-weight="700">SLERP：单位四元数与较短球面弧</text>
<text x="40" y="88" font-size="19" fill="#637084" text-anchor="start" font-weight="400">低维球面截面，不把四元数当成三维位置</text>
<circle cx="290" cy="310" r="170" fill="none" stroke="#d5dee9" stroke-width="3"/>
<circle cx="159.77244466977376" cy="200.7261063532883" r="8" fill="#4264ad" stroke="none" stroke-width="3"/>
<text x="174.77244466977376" y="205.7261063532883" font-size="26" fill="#4264ad" text-anchor="start" font-weight="400">q₀</text>
