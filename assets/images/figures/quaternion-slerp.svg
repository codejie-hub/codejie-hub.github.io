<text x="605" y="240" font-size="23" fill="#253247" text-anchor="middle" font-weight="400">q 与 −q：同一旋转</text>
<text x="605" y="274" font-size="23" fill="#253247" text-anchor="middle" font-weight="400">若点积为负，先变号</text>
<text x="605" y="308" font-size="23" fill="#253247" text-anchor="middle" font-weight="400">再沿较短球面弧插值</text>
