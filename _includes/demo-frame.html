{% assign frame_height = include.height | default: '520px' %}
{% assign frame_title = include.title | default: 'Interactive demo' %}

<div class="demo-frame" style="--demo-height: {{ frame_height }};">
  <iframe
    src="{{ include.src | relative_url }}"
    title="{{ frame_title | escape }}"
    loading="lazy"
    allowfullscreen
  ></iframe>
  <p class="demo-frame__caption">
    {% if include.caption %}{{ include.caption }}{% else %}交互式演示{% endif %}
    <a href="{{ include.src | relative_url }}" rel="noopener noreferrer" target="_blank">独立打开</a>
  </p>
</div>
